name: Dev
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install
      - name: Lint
        run: |
          pnpm lint
      - name: Type check
        run: |
          pnpm typecheck
      - name: Type check the synthetics worker
        run: |
          pnpm --filter qoodish-web-synthetics typecheck
      - name: Type check the admin worker
        run: |
          pnpm --filter qoodish-web-admin typecheck
      - name: Test the admin worker
        run: |
          pnpm --filter qoodish-web-admin test
      - name: Test
        run: |
          pnpm test
