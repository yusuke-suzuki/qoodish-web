name: Post-deploy E2E
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: post-deploy
  cancel-in-progress: true

# Production is the only target on purpose. The dev worker is built with a
# Maps API key loose enough to work on localhost, and every log line of a
# public repository is readable by anyone, so nothing here may drive it.
env:
  BASE_URL: https://qoodish.com

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Deployment belongs to the Cloudflare Git integration, so the only way
      # to know this commit is live is to ask the app itself. Any answer other
      # than the expected SHA — a 404 from a worker that predates the health
      # route included — just keeps the loop waiting.
      - name: Wait for the deployment of this commit
        run: |
          for i in $(seq 1 80); do
            deployed=$(curl -s --max-time 10 "$BASE_URL/api/health" | jq -r '.sha // empty' || true)
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "Deployed SHA matches ${{ github.sha }}"
              exit 0
            fi
            echo "Attempt $i: deployed=${deployed:-unavailable}, want=${{ github.sha }}"
            sleep 15
          done
          echo "Timed out waiting for the deployment" >&2
          exit 1
      - name: Smoke test production
        run: pnpm e2e
        env:
          E2E_BASE_URL: ${{ env.BASE_URL }}
      # A red workflow run is seen only by whoever opens it. An issue waits in
      # the list until someone closes it, and carries the link to the run.
      - name: Open an issue when the verification fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Post-deploy verification failed for ${sha}`,
              labels: ['incident'],
              body: [
                `The post-deploy verification of ${context.sha} failed.`,
                '',
                `Run: ${runUrl}`,
                '',
                'See docs/RUNBOOK.md for how to confirm the deployed commit and how to roll back.'
              ].join('\n')
            });
