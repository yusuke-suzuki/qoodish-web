name: Prod
on:
  push:
    branches:
      - master
concurrency:
  group: prod-deploy
  cancel-in-progress: false
env:
  PROJECT_ID: qoodish
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Decrypt secrets
        run: |
          gcloud secrets versions access latest \
            --secret=QOODISH_WEB_DOTENV \
            --project=$PROJECT_ID \
            --out-file=.env.local
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install
      - name: Lint
        run: |
          pnpm lint
      - name: Biome check
        run: |
          pnpm biome ci ./src
      - name: Deploy to Cloudflare Workers
        run: |
          CLOUDFLARE_API_TOKEN="$(gcloud secrets versions access latest \
            --secret=QOODISH_WEB_CLOUDFLARE_API_TOKEN \
            --project=$PROJECT_ID)"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          pnpm run deploy
